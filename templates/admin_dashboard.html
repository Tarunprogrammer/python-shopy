{% extends "index.html" %} {% block content %}
<div class="container">
    <h2>Admin Dashboard</h2>
    <a href="{{ url_for('admin.add_product') }}" class="btn-shop" style="display:inline-block; margin-bottom:20px;">+ Add New Product</a>
    
    <table border="1" style="width:100%; border-collapse: collapse; background: white;">
        <thead>
            <tr style="background: #232f3e; color: white;">
                <th>Name</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for id, details in products.items() %}
            <tr>
                <td>{{ details.name }}</td>
                <td>${{ details.price }}</td>
                <td>
                    <a href="{{ url_for('admin.delete_product', product_id=id) }}" style="color: red;">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
